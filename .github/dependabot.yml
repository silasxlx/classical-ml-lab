version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      production-minor-patch:
        patterns: ["*"]
        dependency-type: production
        update-types: ["minor", "patch"]
      development-minor-patch:
        patterns: ["*"]
        dependency-type: development
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
