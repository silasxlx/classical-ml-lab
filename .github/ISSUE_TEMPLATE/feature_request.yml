name: Feature request
description: Propose a focused, testable improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include acceptance criteria and safety boundaries.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test approach
      description: Which test should fail before implementation?
    validations:
      required: true
