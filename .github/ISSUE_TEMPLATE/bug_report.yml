name: Bug report
description: Report reproducible incorrect behavior without sharing sensitive data.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include customer data, credentials, or private file contents.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the command, exit code, and sanitized error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
