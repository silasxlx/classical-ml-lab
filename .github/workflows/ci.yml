name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run vulture src --min-confidence 90
      - name: Reject untracked work markers
        shell: bash
        run: |
          if grep -RInE 'TODO|FIXME|HACK' src tests; then
            echo 'TODO/FIXME/HACK requires a tracked issue and policy update.'
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Unit and integration tests
        env:
          MPLBACKEND: Agg
        run: uv run pytest tests/unit tests/integration --disable-socket

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Full branch coverage
        env:
          MPLBACKEND: Agg
        run: >-
          uv run pytest tests/unit tests/integration --disable-socket
          --cov=classical_ml_lab --cov-branch --cov-fail-under=85

  optional-boosting:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        extra: [xgboost, lightgbm, catboost]
        include:
          - extra: xgboost
            tests: tests/integration/test_xgboost_regression.py tests/integration/test_explanations.py
          - extra: lightgbm
            tests: tests/integration/test_lightgbm_regression.py
          - extra: catboost
            tests: tests/integration/test_catboost_regression.py
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra ${{ matrix.extra }}
      - name: Optional model tests
        env:
          MPLBACKEND: Agg
        run: uv run pytest ${{ matrix.tests }} --disable-socket

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Execute clean notebooks
        env:
          MPLBACKEND: Agg
        run: >-
          uv run pytest tests/notebook --disable-socket
          --allow-hosts=localhost,127.0.0.1,::1

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest tests/acceptance -m "not release" --disable-socket
